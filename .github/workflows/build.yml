name: Build self-contained bundles

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to publish, for example v0.2.0
        required: false
        type: string

permissions:
  contents: read

env:
  LLAMA_CPP_VERSION: b10603

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Verify published catalog manifest
        run: |
          go run ./cmd/catalog-manifest validate catalog/catalog.json
          expected="$(awk '{print $1}' catalog/catalog.json.sha256)"
          actual="$(sha256sum catalog/catalog.json | awk '{print $1}')"
          test "${expected}" = "${actual}"
      - name: Validate agent contract and helper
        run: |
          python3 scripts/validate-agent-contract.py
          python3 scripts/test-tapioca-agent-helper.py

  website:
    name: Website and agent docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run lint --prefix website
      - run: npm test --prefix website

  macos-arm64:
    name: macOS Apple Silicon bundle
    needs: [test, website]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build Tapioca
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/tapioca ./cmd/tapioca

      - name: Build native MLX image runtime
        run: bash scripts/build-macos-image-runtime.sh dist/runtime/image

      - name: Bundle llama.cpp with Metal support
        run: |
          curl -fL \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_VERSION}/llama-${LLAMA_CPP_VERSION}-bin-macos-arm64.tar.gz" \
            -o llama.cpp.tar.gz
          mkdir -p dist/runtime/llama.cpp
          tar -xzf llama.cpp.tar.gz -C dist/runtime/llama.cpp --strip-components=1
          test -x dist/runtime/llama.cpp/llama-server

      - name: Build Tapioca Desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          mkdir -p desktop/runtime
          cp -R dist/runtime/llama.cpp desktop/runtime/llama.cpp
          npm ci --prefix desktop
          npm run package --prefix desktop

      - name: Package
        run: |
          tar -C dist -czf tapioca-darwin-arm64.tar.gz tapioca runtime
          shasum -a 256 tapioca-darwin-arm64.tar.gz > tapioca-darwin-arm64.tar.gz.sha256
          desktop_dmg="$(find desktop/release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${desktop_dmg}"
          cp "${desktop_dmg}" tapioca-desktop-macos-arm64.dmg
          shasum -a 256 tapioca-desktop-macos-arm64.dmg > tapioca-desktop-macos-arm64.dmg.sha256
          desktop_zip="$(find desktop/release -maxdepth 1 -name '*-mac*.zip' -print -quit)"
          test -n "${desktop_zip}"
          cp "${desktop_zip}" tapioca-desktop-macos-arm64.zip
          shasum -a 256 tapioca-desktop-macos-arm64.zip > tapioca-desktop-macos-arm64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: tapioca-darwin-arm64
          path: |
            tapioca-darwin-arm64.tar.gz
            tapioca-darwin-arm64.tar.gz.sha256
            tapioca-desktop-macos-arm64.dmg
            tapioca-desktop-macos-arm64.dmg.sha256
            tapioca-desktop-macos-arm64.zip
            tapioca-desktop-macos-arm64.zip.sha256
            desktop/release/*.dmg
            desktop/release/*-mac.zip
          if-no-files-found: error

  windows-amd64:
    name: Windows x64 bundle
    needs: [test, website]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build Tapioca
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-s -w" -o dist/tapioca.exe ./cmd/tapioca

      - name: Bundle llama.cpp with Vulkan support
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/$env:LLAMA_CPP_VERSION/llama-$env:LLAMA_CPP_VERSION-bin-win-vulkan-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile llama.cpp.zip
          New-Item -ItemType Directory -Force dist/runtime/llama.cpp | Out-Null
          Expand-Archive llama.cpp.zip -DestinationPath dist/runtime/llama.cpp
          if (-not (Test-Path dist/runtime/llama.cpp/llama-server.exe)) {
            throw "llama-server.exe was not found in the llama.cpp archive"
          }

      - name: Build Tapioca Desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/runtime | Out-Null
          Copy-Item -Recurse -Force dist/runtime/llama.cpp desktop/runtime/llama.cpp
          npm ci --prefix desktop
          npm run package --prefix desktop

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/tapioca.exe,dist/runtime -DestinationPath tapioca-windows-amd64.zip
          (Get-FileHash tapioca-windows-amd64.zip -Algorithm SHA256).Hash.ToLower() + "  tapioca-windows-amd64.zip" |
            Set-Content tapioca-windows-amd64.zip.sha256
          $desktopInstaller = Get-ChildItem desktop/release/*.exe | Select-Object -First 1
          if (-not $desktopInstaller) { throw "Windows desktop installer was not produced" }
          Copy-Item $desktopInstaller.FullName tapioca-desktop-windows-amd64.exe
          (Get-FileHash tapioca-desktop-windows-amd64.exe -Algorithm SHA256).Hash.ToLower() + "  tapioca-desktop-windows-amd64.exe" |
            Set-Content tapioca-desktop-windows-amd64.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: tapioca-windows-amd64
          path: |
            tapioca-windows-amd64.zip
            tapioca-windows-amd64.zip.sha256
            tapioca-desktop-windows-amd64.exe
            tapioca-desktop-windows-amd64.exe.sha256
            desktop/release/*.exe
            desktop/release/*-win.zip
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 bundle
    needs: [test, website]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build Tapioca for ARM64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags="-s -w" -o dist/tapioca.exe ./cmd/tapioca

      - name: Bundle native ARM64 llama.cpp
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/$env:LLAMA_CPP_VERSION/llama-$env:LLAMA_CPP_VERSION-bin-win-cpu-arm64.zip"
          Invoke-WebRequest -Uri $url -OutFile llama.cpp.zip
          New-Item -ItemType Directory -Force dist/runtime/llama.cpp | Out-Null
          Expand-Archive llama.cpp.zip -DestinationPath dist/runtime/llama.cpp
          if (-not (Test-Path dist/runtime/llama.cpp/llama-server.exe)) {
            throw "ARM64 llama-server.exe was not found in the llama.cpp archive"
          }

      - name: Build Tapioca Desktop for ARM64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/runtime | Out-Null
          Copy-Item -Recurse -Force dist/runtime/llama.cpp desktop/runtime/llama.cpp
          npm ci --prefix desktop
          $env:npm_config_arch = "arm64"
          npm run package --prefix desktop -- --arm64

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/tapioca.exe,dist/runtime -DestinationPath tapioca-windows-arm64.zip
          (Get-FileHash tapioca-windows-arm64.zip -Algorithm SHA256).Hash.ToLower() + "  tapioca-windows-arm64.zip" |
            Set-Content tapioca-windows-arm64.zip.sha256
          $desktopInstaller = Get-ChildItem desktop/release/*.exe | Select-Object -First 1
          if (-not $desktopInstaller) { throw "Windows ARM64 desktop installer was not produced" }
          Copy-Item $desktopInstaller.FullName tapioca-desktop-windows-arm64.exe
          (Get-FileHash tapioca-desktop-windows-arm64.exe -Algorithm SHA256).Hash.ToLower() + "  tapioca-desktop-windows-arm64.exe" |
            Set-Content tapioca-desktop-windows-arm64.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: tapioca-windows-arm64
          path: |
            tapioca-windows-arm64.zip
            tapioca-windows-arm64.zip.sha256
            tapioca-desktop-windows-arm64.exe
            tapioca-desktop-windows-arm64.exe.sha256
            desktop/release/*.exe
            desktop/release/*-win.zip
          if-no-files-found: error

  linux-amd64:
    name: Linux x64 bundle
    needs: [test, website]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build Tapioca
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/tapioca ./cmd/tapioca

      - name: Bundle llama.cpp with Vulkan support
        run: |
          curl -fL \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_VERSION}/llama-${LLAMA_CPP_VERSION}-bin-ubuntu-vulkan-x64.tar.gz" \
            -o llama.cpp.tar.gz
          mkdir -p dist/runtime/llama.cpp
          tar -xzf llama.cpp.tar.gz -C dist/runtime/llama.cpp --strip-components=1
          test -x dist/runtime/llama.cpp/llama-server

      - name: Build Tapioca Desktop
        run: |
          mkdir -p desktop/runtime
          cp -R dist/runtime/llama.cpp desktop/runtime/llama.cpp
          npm ci --prefix desktop
          npm run package --prefix desktop

      - name: Package
        run: |
          tar -C dist -czf tapioca-linux-amd64.tar.gz tapioca runtime
          sha256sum tapioca-linux-amd64.tar.gz > tapioca-linux-amd64.tar.gz.sha256
          desktop_appimage="$(find desktop/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "${desktop_appimage}"
          cp "${desktop_appimage}" tapioca-desktop-linux-amd64.AppImage
          sha256sum tapioca-desktop-linux-amd64.AppImage > tapioca-desktop-linux-amd64.AppImage.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: tapioca-linux-amd64
          path: |
            tapioca-linux-amd64.tar.gz
            tapioca-linux-amd64.tar.gz.sha256
            tapioca-desktop-linux-amd64.AppImage
            tapioca-desktop-linux-amd64.AppImage.sha256
            desktop/release/*.AppImage
            desktop/release/*-linux.tar.gz
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64 bundle
    needs: [test, website]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build Tapioca
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/tapioca ./cmd/tapioca

      - name: Bundle native ARM64 llama.cpp
        run: |
          curl -fL \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_VERSION}/llama-${LLAMA_CPP_VERSION}-bin-ubuntu-vulkan-arm64.tar.gz" \
            -o llama.cpp.tar.gz
          mkdir -p dist/runtime/llama.cpp
          tar -xzf llama.cpp.tar.gz -C dist/runtime/llama.cpp --strip-components=1
          test -x dist/runtime/llama.cpp/llama-server

      - name: Build Tapioca Desktop for ARM64
        run: |
          mkdir -p desktop/runtime
          cp -R dist/runtime/llama.cpp desktop/runtime/llama.cpp
          npm ci --prefix desktop
          npm_config_arch=arm64 npm run package --prefix desktop -- --arm64

      - name: Package
        run: |
          tar -C dist -czf tapioca-linux-arm64.tar.gz tapioca runtime
          sha256sum tapioca-linux-arm64.tar.gz > tapioca-linux-arm64.tar.gz.sha256
          desktop_appimage="$(find desktop/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "${desktop_appimage}"
          cp "${desktop_appimage}" tapioca-desktop-linux-arm64.AppImage
          sha256sum tapioca-desktop-linux-arm64.AppImage > tapioca-desktop-linux-arm64.AppImage.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: tapioca-linux-arm64
          path: |
            tapioca-linux-arm64.tar.gz
            tapioca-linux-arm64.tar.gz.sha256
            tapioca-desktop-linux-arm64.AppImage
            tapioca-desktop-linux-arm64.AppImage.sha256
            desktop/release/*.AppImage
            desktop/release/*-linux.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - macos-arm64
      - windows-amd64
      - windows-arm64
      - linux-amd64
      - linux-arm64
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: tapioca-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *)
              echo "Release tags must begin with v, for example v0.2.0"
              exit 1
              ;;
          esac

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Tapioca ${RELEASE_TAG}" \
              --generate-notes
          fi

          find release-assets -type f -print0 |
            xargs -0 gh release upload "${RELEASE_TAG}" --clobber
