name: Build binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            goos: darwin
            goarch: arm64
            binary: tapioca
            archive: tapioca-darwin-arm64.tar.gz
          - name: Windows x64
            goos: windows
            goarch: amd64
            binary: tapioca.exe
            archive: tapioca-windows-amd64.zip
          - name: Windows ARM64
            goos: windows
            goarch: arm64
            binary: tapioca.exe
            archive: tapioca-windows-arm64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary }}" ./cmd/tapioca

      - name: Package macOS
        if: matrix.goos == 'darwin'
        working-directory: dist
        run: tar -czf "${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Package Windows
        if: matrix.goos == 'windows'
        working-directory: dist
        run: zip "${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Create checksum
        working-directory: dist
        run: sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error

